{% extends "base.html" %}
{% block title %}Create Class — ASDS{% endblock %}

{% block content %}
<a href="{{ url_for('faculty.dashboard') }}" class="back-link">← Back to Dashboard</a>

<div class="auth-container">
    <h2>Create New Class</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="name">Class Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Final Year Project 2026" required>
        </div>
        <button type="submit" class="btn">Create Class</button>
    </form>
</div>
{% endblock %}
