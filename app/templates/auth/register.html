{% extends "base.html" %}
{% block title %}Register — ASDS{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Create Account</h2>
    <p style="text-align:center; color:var(--text-muted); margin-bottom:1.5rem; margin-top:-1rem;">Join ASDS today</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
