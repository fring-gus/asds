{% extends "base.html" %}
{% block title %}Admin Login — ASDS{% endblock %}

{% block content %}
<div class="auth-container">
    <div style="text-align:center; margin-bottom:1.2rem;">
        <span style="font-size:2rem;">🛡️</span>
        <h2 style="margin-top:0.3rem;">System Administrator</h2>
        <p style="color:#999; font-size:0.9rem;">Restricted access — authorised personnel only</p>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter admin username"
                autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn" style="width:100%; background:#9d174d;">Access Admin Panel</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">
        <a href="{{ url_for('main.index') }}" style="color:#999; font-size:0.85rem;">← Back to Home</a>
    </p>
</div>
{% endblock %}
